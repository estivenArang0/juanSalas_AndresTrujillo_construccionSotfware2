# ===== APPLICATION =====
spring.application.name=banking-system
server.port=8080

# ===== SQL DATABASE (H2 for development) =====
spring.datasource.url=jdbc:h2:mem:bancodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== MONGODB (NoSQL - Audit Log) =====
spring.data.mongodb.uri=mongodb://localhost:27017/bancodb_bitacora
spring.data.mongodb.auto-index-creation=true

# ===== JWT =====
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ===== BUSINESS RULES =====
banco.transferencia.umbral-alto-monto=5000000
banco.transferencia.tiempo-vencimiento-minutos=60

# ===== SWAGGER =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
